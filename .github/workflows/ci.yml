name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      # The runner's preinstalled iPhone simulators are paired with Apple Watch
      # simulators whose watchOS runtime is missing, so xcodebuild can't clone
      # them for testing. Create a fresh, unpaired iPhone 17 on the latest iOS.
      - name: Create simulator
        run: |
          xcrun simctl list runtimes iOS
          RUNTIME=$(xcrun simctl list runtimes iOS -j | jq -r '[.runtimes[] | select(.isAvailable and any(.supportedDeviceTypes[]; .name == "iPhone 17"))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
          if [ -z "$RUNTIME" ] || [ "$RUNTIME" = "null" ]; then echo "No iOS runtime supports iPhone 17"; exit 1; fi
          UDID=$(xcrun simctl create "CI iPhone 17" "iPhone 17" "$RUNTIME")
          echo "Created $UDID on $RUNTIME"
          echo "DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build
        id: build
        run: >
          xcodebuild build-for-testing
          -project WorkoutBuddy.xcodeproj
          -scheme WorkoutBuddy
          -destination "$DESTINATION"
          -derivedDataPath DerivedData
          -quiet

      - name: Build (Release)
        run: >
          xcodebuild build
          -project WorkoutBuddy.xcodeproj
          -scheme WorkoutBuddy
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData-Release
          -quiet

      # Both test steps run whenever the Debug build succeeded, even if the
      # Release build or the other test step failed, so both results show.
      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          xcodebuild test-without-building
          -project WorkoutBuddy.xcodeproj
          -scheme WorkoutBuddy
          -destination "$DESTINATION"
          -derivedDataPath DerivedData
          -only-testing:WorkoutBuddyTests
          -resultBundlePath UnitTests.xcresult
          -quiet

      # Boots the simulator before the UI tests (the unit tests run on clones of
      # it) and turns off the keyboard introduction ("Speed up your typing"),
      # which on a fresh simulator can cover the keys in the UI tests.
      - name: Boot simulator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true

      # No retries: a flaky UI test is a bug to fix.
      - name: UI tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          xcodebuild test-without-building
          -project WorkoutBuddy.xcodeproj
          -scheme WorkoutBuddy
          -destination "$DESTINATION"
          -derivedDataPath DerivedData
          -only-testing:WorkoutBuddyUITests
          -parallel-testing-enabled NO
          -resultBundlePath UITests.xcresult
          -quiet

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            UnitTests.xcresult
            UITests.xcresult
          if-no-files-found: ignore

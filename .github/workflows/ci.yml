name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      # The runner's preinstalled iPhone simulators are paired with Apple Watch
      # simulators whose watchOS runtime is missing, so xcodebuild can't clone
      # them for testing. Create a fresh, unpaired iPhone 17 on the latest iOS.
      - name: Create simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes iOS -j | jq -r '[.runtimes[] | select(.isAvailable)] | last | .identifier')
          UDID=$(xcrun simctl create "CI iPhone 17" "iPhone 17" "$RUNTIME")
          echo "Created $UDID on $RUNTIME"
          echo "DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"

      - name: Build
        run: >
          xcodebuild build-for-testing
          -project WorkoutBuddy.xcodeproj
          -scheme WorkoutBuddy
          -destination "$DESTINATION"
          -derivedDataPath DerivedData
          -quiet

      - name: Build (Release)
        run: >
          xcodebuild build
          -project WorkoutBuddy.xcodeproj
          -scheme WorkoutBuddy
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData-Release
          -quiet

      - name: Test
        run: >
          xcodebuild test-without-building
          -project WorkoutBuddy.xcodeproj
          -scheme WorkoutBuddy
          -destination "$DESTINATION"
          -derivedDataPath DerivedData
          -resultBundlePath TestResults.xcresult
          -quiet

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
